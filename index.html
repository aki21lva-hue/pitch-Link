<style>
  :root {
    --pitch-dark: #14382a;
    --pitch: #1f4d3a;
    --pitch-mid: #3c7a5c;
    --pitch-light: #e9f2ea;
    --line: #ffffff;
    --cone: #e8703a;
    --cone-dark: #b8531f;
    --ink: #1a2420;
    --ink-soft: #5b6b62;
    --paper: #f7f5ef;
    --card: #ffffff;
    --border: #dfe3dc;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--pitch-dark);
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .phone {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  header {
    background:
      repeating-linear-gradient(
        115deg,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 26px,
        rgba(0,0,0,0.04) 26px,
        rgba(0,0,0,0.04) 52px
      ),
      linear-gradient(155deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    padding: 22px 20px 18px;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    left: -20%; right: -20%; bottom: 10px;
    height: 1px;
    background: rgba(255,255,255,0.28);
  }
  header::before {
    content: "";
    position: absolute;
    right: 24px; bottom: -18px;
    width: 60px; height: 60px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 50%;
  }
  .header-corner-arc {
    position: absolute;
    top: -22px; left: -22px;
    width: 44px; height: 44px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 50%;
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  .brand-mark {
    font-weight: 700; font-size: 22px; color: var(--line); letter-spacing: 0.02em;
  }
  .brand-sub {
    font-size: 12px; color: rgba(255,255,255,0.65);
  }
  .brand-tag {
    margin-top: 6px;
    font-size: 13px;
    color: rgba(255,255,255,0.8);
    font-weight: 500;
  }
  main {
    flex: 1;
    padding: 16px 16px 90px;
  }
  .tabbar {
    position: sticky; bottom: 0;
    display: flex;
    background: var(--card);
    border-top: 1px solid var(--border);
    width: 100%;
  }
  .tab-btn {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 14px 1px 12px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: -0.2px;
    color: var(--ink-soft);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
  }
  .tab-btn span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .tab-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .tab-btn.active { color: var(--pitch); font-weight: 700; }
  .tab-btn.active svg { stroke: var(--pitch); }

  .section-title {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 16px; font-weight: 700;
    margin: 4px 0 12px;
    color: var(--pitch-dark);
  }

  .filter-row {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  select, input, textarea {
    font-family: inherit;
    font-size: 13.5px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    background: var(--card);
    color: var(--ink);
    width: 100%;
  }
  select:focus, input:focus, textarea:focus {
    outline: none; border-color: var(--pitch-mid);
  }

  .sponsor-banner {
    display: block; margin-top: 18px; position: relative;
    border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
    text-decoration: none;
  }
  .sponsor-banner img {
    width: 100%; display: block;
  }
  .sponsor-tag {
    position: absolute; top: 8px; right: 8px;
    background: rgba(20,56,42,0.75); color: white;
    font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
    padding: 3px 8px; border-radius: 100px;
  }

  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.7;
  }
  .empty svg { width: 40px; height: 40px; stroke: var(--border); margin-bottom: 10px; }

  .post-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 15px;
    margin-bottom: 10px;
  }
  .post-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px; margin-bottom: 8px;
  }
  .post-team {

<body>
<div class="phone">
  <header>

    <div class="brand-tag" id="storage-mode-tag" style="opacity:0.75; font-size:11px;"></div>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="list">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v2M16 4v2"/></svg>
      <span>募集一覧</span>
    </button>
    <button class="tab-btn" data-tab="post">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      <span>投稿する</span>
    </button>
    <button class="tab-btn" data-tab="results">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 21h8M12 17v4M17 4h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4M7 4H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/></svg>
      <span>結果</span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span id="chat-tab-label">チャット</span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="10" cy="7" r="4"/></svg>
      <span>マイ投稿</span>
    </button>

</div>
<div class="toast" id="toast"></div>

<script>
const CATEGORIES = ["U-8","U-9","U-10","U-11","U-12","U-13","U-14","U-15","U-16","U-17","U-18"];
const FORMATS = ["11人制サッカー","8人制サッカー","フットサル","ソサイチ","その他"];
const PREFS = ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];

let activeTab = 'list';
let posts = [];
let sponsors = [];
let filterCat = '';
let filterPref = '';
let filterFormat = '';
let selectedType = '練習試合';
let pendingImage = null;
let deviceId = null;
let myTeamName = null;
let conversations = [];
let readMarks = {};
let chatView = 'list';
let activeConv = null;
let activeMessages = [];
let pollTimer = null;
let pendingChatPostId = null;
let listView = 'list';
let activeDetailPost = null;
let pendingResultImages = [];

const LS_PREFIX = 'matchin:';
const SUPABASE_URL = 'https://oqxchoxtorkzbpferppx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_E6JcZoEYS-E3Kca4oWqLEA_L1X8JKpP';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

window.addEventListener('error', (ev) => {
  try { showToast('エラー: ' + (ev.message || ev.error)); } catch (e) {}
});
window.addEventListener('unhandledrejection', (ev) => {
  try { showToast('エラー: ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason)); } catch (e) {}
});

function localGet(key) {
  return localStorage.getItem(LS_PREFIX + key);
}
function localSet(key, value) {
  localStorage.setItem(LS_PREFIX + key, value);
}

function rowToPost(r) {
  return {
    id: r.id, teamName: r.team_name, category: r.category, format: r.format,
    recruitCount: r.recruit_count, pref: r.pref, type: r.type, date: r.date,
    kickoff: r.kickoff, venueName: r.venue_name, message: r.message, venue: r.venue, contact: r.contact,
    image: r.image, creatorId: r.creator_id, matched: r.matched, createdAt: r.created_at
  };
}
function rowToConv(r) {
  return {
    id: r.id, postId: r.post_id, postTeamName: r.post_team_name,
    ownerId: r.owner_id, ownerTeam: r.owner_team, viewerId: r.viewer_id, viewerTeam: r.viewer_team,
    updatedAt: r.updated_at, lastMessage: r.last_message
  };
}
function rowToMsg(r) {
  return { from: r.from_device, text: r.text, image: r.image, at: r.at };
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function formatMatchDate(p) {
  const d = p.date ? p.date : '応相談';
  return p.kickoff ? `${d} ${p.kickoff}〜` : d;
}

function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} 投稿`;
}

async function loadPosts() {
  try {
    const { data, error } = await sb.from('posts').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    posts = (data || []).map(rowToPost);
  } catch (e) { posts = []; }
}

async function loadSponsors() {
  try {
    const { data, error } = await sb.from('sponsors').select('*').eq('active', true).order('sort_order', { ascending: true });
    if (error) throw error;
    sponsors = data || [];
  } catch (e) { sponsors = []; }
}

function renderSponsorBanner(placement) {
  const items = sponsors.filter(s => s.placement === placement);
  if (items.length === 0) return '';
  return items.map(s => `
    <a href="${s.link_url}" target="_blank" rel="noopener noreferrer" class="sponsor-banner">
      <span class="sponsor-tag">PR</span>
      <img src="${s.image}" alt="${escapeHtml(s.name)}">
    </a>`).join('');
}

const LIFF_ID = '2006739848-9rAkD0df';
let lineProfile = null;

async function initIdentity() {
  try {
    if (typeof liff === 'undefined') throw new Error('liff sdk not loaded');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return false;
    }
    const profile = await liff.getProfile();
    lineProfile = profile;
    deviceId = 'line:' + profile.userId;
    localSet('device-id', deviceId);
    return true;
  } catch (e) {
    deviceId = localGet('device-id');
    if (!deviceId) {
      deviceId = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      localSet('device-id', deviceId);
    }
    return true;
  }
}

async function loadData() {
  const ready = await initIdentity();
  if (!ready) return;
  myTeamName = localGet('my-team-name');

  try {
    const rm = localGet('read-marks');
    readMarks = rm ? JSON.parse(rm) : {};
  } catch (e) { readMarks = {}; }

  await loadPosts();
  await loadSponsors();
  await loadConversations();

  render();
}

async function loadConversations() {
  try {
    const { data, error } = await sb.from('conversations').select('*')
      .or(`owner_id.eq.${deviceId},viewer_id.eq.${deviceId}`)
      .order('updated_at', { ascending: false });
    if (error) throw error;
    conversations = (data || []).map(rowToConv);
  } catch (e) { conversations = []; }
}

function hasUnread() {
  return conversations.some(c => (readMarks[c.id] || '') < c.updatedAt);
}

function optionsHtml(list, selected, allLabel) {
  let h = `<option value="">${allLabel}</option>`;
  for (const item of list) h += `<option value="${item}" ${item===selected?'selected':''}>${item}</option>`;
  return h;
}

function renderList() {
  const filtered = posts.filter(p =>
    (!filterCat || p.category === filterCat) &&
    (!filterPref || p.pref === filterPref) &&
    (!filterFormat || p.format === filterFormat)
  );

  let html = `
    <div class="filter-row">
      <select id="fcat">${optionsHtml(CATEGORIES, filterCat, '学年:すべて')}</select>
      <select id="fformat">${optionsHtml(FORMATS, filterFormat, '形式:すべて')}</select>
    </div>
    <div class="filter-row">
      <select id="fpref">${optionsHtml(PREFS, filterPref, '都道府県:すべて')}</select>
    </div>
  `;

  if (filtered.length === 0) {
    html += `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M8 15c1 1.3 2.3 2 4 2s3-.7 4-2"/></svg><br>
        まだ募集がありません。<br>「投稿する」から対戦相手を探してみましょう。
      </div>`;
  } else {
    for (const p of filtered) {
      html += `
        <div class="post-card post-card-clickable" data-action="open-detail" data-id="${p.id}">
          <div class="post-top">
            <div class="post-team">${escapeHtml(p.teamName)}</div>
            <div style="display:flex; gap:6px; flex-shrink:0;">
              ${p.matched ? '<span class="badge badge-closed">募集終了</span>' : ''}
              <span class="badge ${badgeClass(p.type)}">${p.type}</span>
            </div>
          </div>
          <div class="post-meta">
            <span>${p.category}</span>
            <span>${p.format || ''}</span>
            <span>募集: ${p.recruitCount ? p.recruitCount + 'チーム' : '未記載'}</span>
            <span>${p.pref || '地域未記載'}</span>
            <span>実施日: ${escapeHtml(formatMatchDate(p))}</span>
            ${p.venueName ? `<span>📍 ${escapeHtml(p.venueName)}</span>` : ''}
          </div>
          <div class="post-msg post-msg-clamp">${escapeHtml(p.message || 'メッセージなし')}</div>
          <div class="post-foot">
            <span class="post-date">${fmtDate(p.createdAt)}</span>
            <span class="detail-hint">詳細を見る ›</span>
          </div>
        </div>`;
    }
  }
  return html;
}

function renderPostDetail(p) {
  const isOwn = p.creatorId && p.creatorId === deviceId;
  return `

function handleResultImageSelect(e) {
  const file = e.target.files[0];
  const errEl = document.getElementById('r-image-error');
  errEl.style.display = 'none';
  if (!file) return;
  if (pendingResultImages.length >= 3) {
    errEl.textContent = '写真は3枚までです';
    errEl.style.display = 'block';
    e.target.value = '';
    return;
  }
  if (file.size > 3 * 1024 * 1024) {
    errEl.textContent = '写真は3枚まで、1枚3MBまでです';
    errEl.style.display = 'block';
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingResultImages.push(reader.result);
    renderResultImagePreview();
    e.target.value = '';
  };
  reader.readAsDataURL(file);
}

function removeResultImage(idx) {
  pendingResultImages.splice(Number(idx), 1);
  renderResultImagePreview();
}

function getResultShareData() {
  const team = document.getElementById('r-team').value.trim();
  const opponent = document.getElementById('r-opponent').value.trim();
  const ourScoreRaw = document.getElementById('r-our-score').value.trim();
  const oppScoreRaw = document.getElementById('r-opp-score').value.trim();
  const date = document.getElementById('r-date').value.trim();
  const comment = document.getElementById('r-comment').value.trim();
  const video = document.getElementById('r-video').value.trim();
  const errEl = document.getElementById('r-error');

  const ourScore = ourScoreRaw === '' ? null : parseInt(ourScoreRaw, 10);
  const opponentScore = oppScoreRaw === '' ? null : parseInt(oppScoreRaw, 10);

  if (!opponent || ourScore === null || isNaN(ourScore) || opponentScore === null || isNaN(opponentScore)) {
    errEl.style.display = 'block';
    showToast('対戦相手チーム名とスコアは必須です');
    return null;
  }
  errEl.style.display = 'none';

  const teamName = team || myTeamName || '自チーム';
  const lines = [`${teamName} ${ourScore}-${opponentScore} ${opponent}`];
  if (date) lines.push(date);
  if (comment) lines.push(comment);
  if (video) lines.push(video);
  return { text: lines.join('\n') };
}

async function dataUrlToFile(dataUrl, filename) {
  const res = await fetch(dataUrl);
  const blob = await res.blob();
  return new File([blob], filename, { type: blob.type || 'image/jpeg' });
}

async function shareResultNative() {
  const data = getResultShareData();
  if (!data) return;
  if (!navigator.share) {
    showToast('この端末は共有機能に対応していません。下のボタンをお使いください');
    return;
  }
  try {
    const shareData = { title: '試合結果', text: data.text };
    if (pendingResultImages.length && navigator.canShare) {
      const files = await Promise.all(pendingResultImages.map((d, i) => dataUrlToFile(d, `result-${i+1}.jpg`)));
      if (navigator.canShare({ files })) shareData.files = files;
    }
    await navigator.share(shareData);
  } catch (e) {
    if (e && e.name !== 'AbortError') showToast('共有に失敗しました: ' + (e.message || e));
  }
}

function openInstagramCompose() {
  const fallbackUrl = 'https://www.instagram.com/';
  let appOpened = false;
  const onVisChange = () => { if (document.hidden) appOpened = true; };
  document.addEventListener('visibilitychange', onVisChange);
  try {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = 'instagram://camera';
    document.body.appendChild(iframe);
    setTimeout(() => { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 1500);
  } catch (e) {}
  setTimeout(() => {
    document.removeEventListener('visibilitychange', onVisChange);
    if (!appOpened) {
      window.open(fallbackUrl, '_blank', 'noopener');
    }
  }, 1200);
}

function shareResult(platform) {
  const data = getResultShareData();
  if (!data) return;
  const text = data.text;
  if (platform === 'instagram') {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => showToast('キャプションをコピーしました。Instagramの投稿画面に貼り付けてください'),
        () => showToast('コピーに失敗しました。テキストは手動で入力してください')
      );
    } else {
      showToast('このブラウザではコピー機能が使えません');
    }
    openInstagramCompose();
    return;
  }
  if (platform === 'x') {
    window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text), '_blank', 'noopener');
  } else if (platform === 'line') {
    window.open('https://social-plugins.line.me/lineit/share?text=' + encodeURIComponent(text), '_blank', 'noopener');
  } else if (platform === 'copy') {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => showToast('テキストをコピーしました'),
        () => showToast('コピーに失敗しました')
      );
    } else {
      showToast('このブラウザではコピー機能が使えません');
    }
  }
}

function fmtTime(iso) {
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}

async function openOrCreateConversation(postId) {
  const post = posts.find(p => p.id === postId);
  if (!post || !post.creatorId) { showToast('この投稿にはチャットできません'); return; }
  try {
    const { data: existing, error: findErr } = await sb.from('conversations').select('*')
      .eq('post_id', postId).eq('owner_id', post.creatorId).eq('viewer_id', deviceId).limit(1);
    if (findErr) throw findErr;
    let conv;
    if (existing && existing.length) {
      conv = rowToConv(existing[0]);
    } else {
      const newId = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const { error: insErr } = await sb.from('conversations').insert({
        id: newId, post_id: postId, post_team_name: post.teamName,
        owner_id: post.creatorId, owner_team: post.teamName,
        viewer_id: deviceId, viewer_team: myTeamName, last_message: ''
      });
      if (insErr) throw insErr;
      conv = { id: newId, postId, postTeamName: post.teamName, ownerId: post.creatorId, ownerTeam: post.teamName, viewerId: deviceId, viewerTeam: myTeamName, updatedAt: new Date().toISOString(), lastMessage: '' };
    }
    await loadConversations();
    activeTab = 'chat';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'chat'));
    openThread(conv.id);
  } catch (e) { showToast('チャットの開始に失敗しました: ' + (e && e.message ? e.message : e)); }
}

async function openThread(convId) {
  const conv = conversations.find(c => c.id === convId) || (await refreshAndFind(convId));
  if (!conv) { showToast('会話が見つかりません'); return; }
  activeConv = conv;
  chatView = 'thread';
  activeTab = 'chat';
  await loadMessages(convId);
  readMarks[convId] = new Date().toISOString();
  localSet('read-marks', JSON.stringify(readMarks));
  render();
  scrollThreadToBottom();
  startPolling();
}

async function refreshAndFind(convId) {
  await loadConversations();
  return conversations.find(c => c.id === convId);
}

async function loadMessages(convId) {
  try {
    const { data, error } = await sb.from('messages').select('*').eq('conv_id', convId).order('at', { ascending: true });
    if (error) throw error;
    activeMessages = (data || []).map(rowToMsg);
  } catch (e) { activeMessages = []; }
}

function closeThread() {
  stopPolling();
  chatView = 'list';
  activeConv = null;
  loadConversations().then(render);
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    if (!activeConv) return;
    const before = activeMessages.length;
    await loadMessages(activeConv.id);
    if (activeMessages.length !== before) {
      renderThreadMessagesOnly();
      readMarks[activeConv.id] = new Date().toISOString();
      localSet('read-marks', JSON.stringify(readMarks));
    }
  }, 3000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

        </button>
      </div>
    </div>`;

function renderBubbles() {
  if (activeMessages.length === 0) {
    return `<div class="empty" style="padding:30px 20px;">メッセージを送って会話を始めましょう。</div>`;
  }
  return activeMessages.map(m => {
    const mine = m.from === deviceId;
    const inner = m.image
      ? `<img src="${m.image}" class="chat-image">${m.text ? `<div style="margin-top:6px;">${escapeHtml(m.text)}</div>` : ''}`
      : escapeHtml(m.text);
    return `<div class="msg-row ${mine ? 'mine' : 'theirs'}">
      ${mine ? `<span class="msg-time">${fmtTime(m.at)}</span>` : ''}
      <div class="bubble ${m.image ? 'bubble-image' : ''}">${inner}</div>
      ${!mine ? `<span class="msg-time">${fmtTime(m.at)}</span>` : ''}
    </div>`;
  }).join('');
}

function renderThreadMessagesOnly() {
  const el = document.getElementById('thread-msgs');
  if (!el) return;
  el.innerHTML = renderBubbles();
  scrollThreadToBottom();
}

function scrollThreadToBottom() {
  requestAnimationFrame(() => {
    const el = document.getElementById('thread-msgs');
    if (el) el.scrollTop = el.scrollHeight;
  });
}

function wireThread() {
  const input = document.getElementById('thread-input');
  const sendBtn = document.getElementById('thread-send');
  const imgBtn = document.getElementById('thread-img-btn');
  const imgInput = document.getElementById('thread-image-input');
  if (!input || !sendBtn) return;
  scrollThreadToBottom();
  const doSend = () => sendMessage(input);
  sendBtn.onclick = doSend;
  input.onkeydown = (e) => { if (e.key === 'Enter') doSend(); };
  if (imgBtn && imgInput) {
    imgBtn.onclick = () => imgInput.click();
    imgInput.onchange = handleChatImageSelect;
  }
}

function handleChatImageSelect(e) {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) {
    showToast('画像は3MBまでです');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => sendChatImage(reader.result);
  reader.readAsDataURL(file);
}

async function sendChatImage(dataUrl) {
  if (!activeConv) return;
  const msg = { from: deviceId, text: '', image: dataUrl, at: new Date().toISOString() };
  activeMessages.push(msg);
  renderThreadMessagesOnly();

  try {
    const { error: msgErr } = await sb.from('messages').insert({
      conv_id: activeConv.id, from_device: deviceId, text: '', image: dataUrl, at: msg.at
    });
    if (msgErr) throw msgErr;

    const { error: updErr } = await sb.from('conversations')
      .update({ updated_at: msg.at, last_message: '📷 画像' })
      .eq('id', activeConv.id);
    if (updErr) throw updErr;

    activeConv = { ...activeConv, updatedAt: msg.at, lastMessage: '📷 画像' };
    readMarks[activeConv.id] = msg.at;
    localSet('read-marks', JSON.stringify(readMarks));
  } catch (e) { showToast('画像の送信に失敗しました: ' + (e && e.message ? e.message : e)); }
}

async function sendMessage(input) {
  const text = input.value.trim();
  if (!text || !activeConv) return;
  input.value = '';
  const msg = { from: deviceId, text, at: new Date().toISOString() };
  activeMessages.push(msg);
  renderThreadMessagesOnly();

  try {
    const { error: msgErr } = await sb.from('messages').insert({
      conv_id: activeConv.id, from_device: deviceId, text, at: msg.at
    });
    if (msgErr) throw msgErr;

    const { error: updErr } = await sb.from('conversations')
      .update({ updated_at: msg.at, last_message: text })
      .eq('id', activeConv.id);
    if (updErr) throw updErr;

    activeConv = { ...activeConv, updatedAt: msg.at, lastMessage: text };
    readMarks[activeConv.id] = msg.at;
    localSet('read-marks', JSON.stringify(readMarks));
  } catch (e) { showToast('送信に失敗しました: ' + (e && e.message ? e.message : e)); }
}

function escapeHtml(s) {
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function renderPost() {
  return `
    <div class="note">投稿内容は他のチームの監督・コーチにも公開されます。個人が特定される情報の入力は避けてください。</div>
    <div id="postForm">
      <div class="field">
        <label>チーム名(必須)</label>
        <input type="text" id="f-team" placeholder="例: FC〇〇ジュニア">
      </div>
      <div class="field">
        <label>学年カテゴリ(必須)</label>
        <select id="f-cat">${optionsHtml(CATEGORIES, '', '選択してください')}</select>
        <div class="error-text" id="f-error">チーム名・学年カテゴリ・競技形式・募集チーム数・実施日・会場名は必須です</div>
      </div>
      <div class="field">
        <label>競技形式(必須)</label>
        <select id="f-format">${optionsHtml(FORMATS, '', '選択してください')}</select>
      </div>
      <div class="field">
        <label>募集チーム数(必須)</label>
        <input type="number" id="f-recruit-count" min="1" step="1" placeholder="例: 2">
      </div>
      <div class="field">
        <label>募集要項</label>
        <div class="type-toggle">
          <button type="button" data-type="練習試合" class="${selectedType==='練習試合'?'selected':''}">練習試合</button>
          <button type="button" data-type="招待大会" class="${selectedType==='招待大会'?'selected':''}">招待大会</button>
          <button type="button" data-type="大会合宿" class="${selectedType==='大会合宿'?'selected':''}">大会合宿</button>
        </div>
      </div>
      <div class="field">
        <label>都道府県(任意)</label>
        <select id="f-pref">${optionsHtml(PREFS, '', '選択してください')}</select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>実施日(必須)</label>
          <input type="text" id="f-date" placeholder="例: 11/3(月祝)">
        </div>
        <div class="field">
          <label>キックオフ時間(任意)</label>
          <input type="time" id="f-kickoff">
        </div>
      </div>
      <div class="field">
        <label>会場名(必須)</label>
        <input type="text" id="f-venue-name" placeholder="例: 〇〇市総合グラウンド">
      </div>
      <div class="field">
        <label>メッセージ(任意)</label>
        <textarea id="f-msg" placeholder="対戦レベル、会場、遠征先の候補など詳しく書きましょう"></textarea>
      </div>
      <div class="field">
        <label>会場の諸注意(任意)</label>
        <textarea id="f-venue" placeholder="駐車場、更衣室、雨天時の対応、持ち物など"></textarea>
      </div>
      <div class="field">
        <label>画像(任意)</label>
        <input type="file" id="f-image" accept="image/*">
        <div id="image-preview-wrap"></div>
        <div class="error-text" id="f-image-error">画像サイズが大きすぎます(3MBまで)</div>
      </div>
      <div class="field">
        <label>連絡先(任意)</label>
        <input type="text" id="f-contact" placeholder="メールアドレスなど">
      </div>
      <button type="button" id="submit-post-btn" data-action="submit-post" class="submit-btn">この内容で募集を投稿する</button>
    </div>
  `;
}

function renderMine() {
  const mine = posts.filter(p => p.creatorId === deviceId);
  if (mine.length === 0) {
    return `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="10" cy="7" r="4"/></svg><br>
      まだ投稿がありません。
    </div>`;
  }
  let html = '';
  for (const p of mine) {
    html += `
      <div class="post-card">
        <div class="post-top">
          <div class="post-team">${escapeHtml(p.teamName)}</div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            ${p.matched ? '<span class="badge badge-closed">募集終了</span>' : ''}
            <span class="badge ${badgeClass(p.type)}">${p.type}</span>
          </div>
        </div>
        <div class="post-meta">
          <span>${p.category}</span><span>${p.format || ''}</span><span>募集: ${p.recruitCount ? p.recruitCount + 'チーム' : '未記載'}</span><span>${p.pref || '地域未記載'}</span><span>実施日: ${escapeHtml(formatMatchDate(p))}</span>${p.venueName ? `<span>📍 ${escapeHtml(p.venueName)}</span>` : ''}
        </div>
        <div class="post-msg">${escapeHtml(p.message)}</div>
        ${p.image ? `<img class="post-image" src="${p.image}">` : ''}
        ${p.venue ? `<div class="post-venue"><span class="post-venue-label">会場の諸注意</span>${escapeHtml(p.venue)}</div>` : ''}
        <div class="post-foot">
          <span class="post-date">${fmtDate(p.createdAt)}</span>
          <div class="post-foot-actions">
            <button class="contact-btn" data-action="toggle-matched" data-id="${p.id}">${p.matched ? '募集を再開する' : 'マッチング成立にする'}</button>
            <button class="delete-btn" data-action="delete-post" data-id="${p.id}">削除</button>
          </div>
        </div>
      </div>`;
  }
  return html;
}

async function toggleMatched(id) {
  const post = posts.find(p => p.id === id);
  if (!post) return;
  const newMatched = !post.matched;
  try {
    const { error } = await sb.from('posts').update({ matched: newMatched }).eq('id', id);
    if (error) throw error;
    posts = posts.map(p => p.id === id ? { ...p, matched: newMatched } : p);
    showToast(newMatched ? '募集終了にしました' : '募集を再開しました');
    render();
  } catch (e) {
    showToast('更新に失敗しました: ' + (e && e.message ? e.message : e));
  }
}

async function deletePost(id) {
  try {
    const { error } = await sb.from('posts').delete().eq('id', id);
    if (error) throw error;
    posts = posts.filter(p => p.id !== id);
    showToast('削除しました');
    render();
  } catch (e) { showToast('削除に失敗しました: ' + (e && e.message ? e.message : e)); }
}

function render() {
  const modeTag = document.getElementById('storage-mode-tag');
  if (modeTag) {
    modeTag.textContent = lineProfile
      ? `🌐 全チーム共有モード(LINE連携: ${lineProfile.displayName})`
      : '🌐 全チーム共有モード(Supabase接続)';
  }
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  const chatLabel = document.getElementById('chat-tab-label');
  if (chatLabel) chatLabel.textContent = 'チャット' + (hasUnread() ? ' ●' : '');
  const main = document.getElementById('main');
  if (activeTab === 'list') {
    if (listView === 'detail' && activeDetailPost) {
      main.innerHTML = renderPostDetail(activeDetailPost);
      return;
    }
    main.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="section-title" style="margin-bottom:0;">対戦相手・遠征先を探す</div>
        <button type="button" id="refresh-list-btn" style="border:1px solid var(--border); background:var(--card); border-radius:100px; padding:5px 11px; font-size:11.5px; color:var(--pitch); font-family:inherit; cursor:pointer;">更新</button>
      </div>
      <div style="height:12px;"></div>
    ` + renderList() + renderSponsorBanner('list_bottom');
    document.getElementById('refresh-list-btn').onclick = async (e) => {
      e.target.textContent = '更新中…';
      await loadPosts();
      render();
    };
    document.getElementById('fcat').onchange = e => { filterCat = e.target.value; render(); };
    document.getElementById('fformat').onchange = e => { filterFormat = e.target.value; render(); };
    document.getElementById('fpref').onchange = e => { filterPref = e.target.value; render(); };
  } else if (activeTab === 'post') {
    main.innerHTML = `<div class="section-title">対戦相手を募集する</div>` + renderPost();
    document.querySelectorAll('.type-toggle button').forEach(btn => {
      btn.onclick = () => { selectedType = btn.dataset.type; render(); };
    });
    document.getElementById('f-image').onchange = handleImageSelect;
    renderImagePreview();
  } else if (activeTab === 'mine') {
    main.innerHTML = `<div class="section-title">自分の投稿</div>` + renderMine();
  } else if (activeTab === 'results') {
    main.innerHTML = `<div class="section-title">試合結果をSNSへシェア</div>` + renderResultForm() + renderSponsorBanner('results_bottom');
    document.getElementById('r-image').onchange = handleResultImageSelect;
    renderResultImagePreview();
  } else if (activeTab === 'chat') {
    if (chatView === 'thread' && activeConv) {
      main.innerHTML = renderThread();
      wireThread();
    } else {
      main.innerHTML = `<div class="section-title">チャット</div>` + renderConvList();
    }
  }
}

function handleImageSelect(e) {
  const file = e.target.files[0];
  const errEl = document.getElementById('f-image-error');
  errEl.style.display = 'none';
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) {
    errEl.style.display = 'block';
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingImage = reader.result;
    renderImagePreview();
  };
  reader.readAsDataURL(file);
}

function renderImagePreview() {
  const wrap = document.getElementById('image-preview-wrap');
  if (!wrap) return;
  wrap.innerHTML = pendingImage
    ? `<div class="img-preview"><img src="${pendingImage}"><button type="button" class="remove-img" id="remove-img-btn">&times;</button></div>`
    : '';
  if (pendingImage) {
    document.getElementById('remove-img-btn').onclick = () => {
      pendingImage = null;
      document.getElementById('f-image').value = '';
      renderImagePreview();
    };
  }
}

async function handleSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();
  const team = document.getElementById('f-team').value.trim();
  const cat = document.getElementById('f-cat').value;
  const format = document.getElementById('f-format').value;
  const recruitCountRaw = document.getElementById('f-recruit-count').value.trim();
  const recruitCount = recruitCountRaw ? parseInt(recruitCountRaw, 10) : 0;
  const pref = document.getElementById('f-pref').value;
  const date = document.getElementById('f-date').value.trim();
  const kickoff = document.getElementById('f-kickoff').value.trim();
  const venueName = document.getElementById('f-venue-name').value.trim();
  const msg = document.getElementById('f-msg').value.trim();
  const venue = document.getElementById('f-venue').value.trim();
  const contact = document.getElementById('f-contact').value.trim();
  const errEl = document.getElementById('f-error');

  if (!team || !cat || !format || !recruitCount || recruitCount < 1 || !date || !venueName) {
    errEl.style.display = 'block';
    showToast('チーム名・学年カテゴリ・競技形式・募集チーム数・実施日・会場名は必須です');
    return;
  }
  errEl.style.display = 'none';

  if (!myTeamName) {
    myTeamName = team;
    localSet('my-team-name', team);
  }

  const id = Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const post = { id, teamName: team, category: cat, format, recruitCount, pref, type: selectedType, date, kickoff, venueName, message: msg, venue, contact, image: pendingImage, creatorId: deviceId, matched: false, createdAt: new Date().toISOString() };

  const submitBtn = document.getElementById('submit-post-btn');
  submitBtn.textContent = '投稿中...';

  try {
    const { error } = await sb.from('posts').insert({
      id, team_name: team, category: cat, format, recruit_count: recruitCount,
      pref, type: selectedType, date, kickoff, venue_name: venueName, message: msg, venue, contact,
      image: pendingImage, creator_id: deviceId, matched: false
    });
    if (error) throw error;
    posts.unshift(post);
    pendingImage = null;
    showToast('募集を投稿しました');
    activeTab = 'list';
    render();
  } catch (err) {
    submitBtn.textContent = 'この内容で募集を投稿する';
    showToast('投稿に失敗しました: ' + (err && err.message ? err.message : err));
  }
}

document.getElementById('main').addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  if (action === 'contact') contactPost(id);
  else if (action === 'chat') startChat(id);
  else if (action === 'open-thread') openThread(id);
  else if (action === 'close-thread') closeThread();
  else if (action === 'open-detail') openPostDetail(id);
  else if (action === 'close-detail') closePostDetail();
  else if (action === 'delete-post') deletePost(id);
  else if (action === 'toggle-matched') toggleMatched(id);
  else if (action === 'remove-result-image') removeResultImage(el.dataset.idx);
  else if (action === 'share-native') shareResultNative();
  else if (action === 'share-instagram') shareResult('instagram');
  else if (action === 'share-line') shareResult('line');
  else if (action === 'share-copy') shareResult('copy');
  else if (action === 'submit-post') handleSubmit(e);
});

document.querySelectorAll('.tab-btn').forEach(b => {
  b.onclick = () => {
    activeTab = b.dataset.tab;
    selectedType = selectedType || '練習試合';
    listView = 'list';
    activeDetailPost = null;
    if (activeTab !== 'results') {
      pendingResultImages = [];
    }
    if (activeTab !== 'chat') {
      stopPolling();
      chatView = 'list';
      activeConv = null;
    }
    if (activeTab === 'chat') {
      loadConversations().then(render);
      return;
    }
    if (activeTab === 'list' || activeTab === 'mine') {
      render();
      loadPosts().then(render);
      return;
    }
    render();
  };
});

loadData();
</script>
</body>
</html>
